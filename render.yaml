services:
  - type: web
    name: newsr-app
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANDROID_RELEASE_OWNER
        sync: false
      - key: ANDROID_RELEASE_REPO
        sync: false
      - key: ANDROID_RELEASE_ASSET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
